<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <title>Jaycar discrete fast K-line interface schematic</title>
  <desc>Build schematic for a Raspberry Pi Pico to Subaru OBD-II K-line interface using a Jaycar LM393 comparator, BF469 transistor, BAT46 Baker clamp, and through-hole resistors.</desc>
  <defs>
    <style>
      .bg { fill: #fcfcf8; }
      .wire { fill: none; stroke: #171717; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .signal { fill: none; stroke: #146aa3; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .kline { fill: none; stroke: #b66b00; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .power { fill: none; stroke: #aa2020; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .ground { fill: none; stroke: #222; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .part { fill: #fff; stroke: #171717; stroke-width: 3; }
      .optional { fill: #f5f5f5; stroke: #777; stroke-width: 3; stroke-dasharray: 10 7; }
      .node { fill: #171717; }
      .test { fill: #fff; stroke: #555; stroke-width: 3; }
      .title { font-family: Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #111; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #3a3a3a; }
      .section { font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #171717; }
      .text { font-family: Arial, sans-serif; font-size: 16px; fill: #171717; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
      .tiny { font-family: Arial, sans-serif; font-size: 12px; fill: #444; }
      .pin { font-family: monospace; font-size: 15px; font-weight: 700; fill: #552070; }
      .net { font-family: monospace; font-size: 16px; font-weight: 700; fill: #146aa3; }
      .note { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #8c2b12; }
    </style>
    <marker id="npnArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#171717"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1200"/>
  <text class="title" x="45" y="52">Jaycar discrete fast K-line interface — RP2040 ↔ Subaru OBD-II</text>
  <text class="subtitle" x="45" y="82">Revision A • USB-powered Pico • inverted physical TX • normal RX • no external K-line pull-up</text>

  <!-- Power rails -->
  <path class="power" d="M690 125 H1580 V185"/>
  <text class="label" x="690" y="111">+5_USB — Pico VBUS, physical pin 40</text>
  <circle class="test" cx="790" cy="125" r="10"/>
  <text class="net" x="750" y="155">TP4 5V</text>

  <path class="power" d="M1180 155 H1540 V185"/>
  <text class="label" x="1180" y="143">+3V3 — Pico 3V3 OUT, physical pin 36</text>
  <circle class="test" cx="1315" cy="155" r="10"/>
  <text class="net" x="1275" y="185">TP5 3V3</text>

  <!-- OBD connector -->
  <rect class="part" x="45" y="205" width="215" height="450" rx="13"/>
  <text class="section" x="77" y="240">J1  OBD-II</text>
  <text class="text" x="66" y="304">Pin 7  K-line</text>
  <text class="text" x="66" y="444">Pin 16 VBAT</text>
  <text class="text" x="66" y="554">Pin 5  SGND</text>
  <text class="text" x="66" y="619">Pin 4  CGND</text>
  <circle class="node" cx="260" cy="295" r="6"/>
  <circle class="node" cx="260" cy="435" r="6"/>
  <circle class="node" cx="260" cy="545" r="6"/>
  <circle class="node" cx="260" cy="610" r="6"/>

  <!-- K connector and R1 -->
  <path class="kline" d="M260 295 H365"/>
  <circle class="test" cx="310" cy="295" r="10"/>
  <text class="net" x="276" y="270">TP1 K</text>
  <rect class="part" x="365" y="276" width="120" height="38" rx="3"/>
  <text class="label" x="404" y="267">R1</text>
  <text class="text" x="389" y="302">22 Ω / 1 W</text>
  <text class="tiny" x="383" y="330">RR2534</text>
  <path class="kline" d="M485 295 H690"/>
  <circle class="node" cx="555" cy="295" r="7"/>
  <circle class="test" cx="625" cy="295" r="10"/>
  <text class="net" x="520" y="270">K_INT</text>
  <text class="net" x="590" y="330">TP2 K_INT</text>

  <!-- Optional TVS footprint -->
  <path class="wire" d="M310 295 V325" stroke-dasharray="9 7"/>
  <rect class="optional" x="285" y="325" width="50" height="55" rx="5"/>
  <path class="wire" d="M292 341 H328 M292 363 H328 M296 363 L324 341"/>
  <path class="wire" d="M310 380 V397" stroke-dasharray="9 7"/>
  <path class="ground" d="M282 397 H338 M290 408 H330 M299 419 H321"/>
  <text class="label" x="350" y="344" fill="#666">D1 DNP</text>
  <text class="small" x="350" y="365">1.5KE36CA</text>
  <text class="small" x="350" y="386">ZR1177 optional</text>

  <!-- Receive K divider -->
  <rect class="part" x="690" y="276" width="125" height="38" rx="3"/>
  <text class="label" x="730" y="267">R2</text>
  <text class="text" x="718" y="302">47 kΩ</text>
  <text class="tiny" x="724" y="330">RR0612</text>
  <path class="wire" d="M815 295 H940"/>
  <circle class="node" cx="885" cy="295" r="7"/>
  <text class="net" x="837" y="270">K_SENSE</text>
  <path class="wire" d="M885 295 V345"/>
  <rect class="part" x="867" y="345" width="36" height="100" rx="3"/>
  <text class="label" x="913" y="382">R3</text>
  <text class="text" x="913" y="406">4.7 kΩ</text>
  <text class="tiny" x="913" y="428">RR0588</text>
  <path class="wire" d="M885 445 V467"/>
  <path class="ground" d="M857 467 H913 M865 478 H905 M874 489 H896"/>

  <!-- LM393 comparator U1B -->
  <path class="part" d="M1010 230 L1010 455 L1215 342 Z"/>
  <text class="label" x="1065" y="331">U1B</text>
  <text class="text" x="1054" y="356">LM393</text>
  <text class="tiny" x="1047" y="379">ZL3393</text>
  <text class="pin" x="982" y="292">5</text>
  <text class="label" x="1023" y="295">+</text>
  <text class="pin" x="982" y="407">6</text>
  <text class="label" x="1023" y="410">−</text>
  <text class="pin" x="1182" y="329">7</text>
  <path class="wire" d="M940 295 H1010"/>

  <!-- Battery tracking VREF -->
  <path class="power" d="M260 435 H510"/>
  <rect class="part" x="510" y="416" width="130" height="38" rx="3"/>
  <text class="label" x="553" y="407">R4</text>
  <text class="text" x="539" y="442">100 kΩ</text>
  <text class="tiny" x="548" y="470">RR0620</text>
  <path class="wire" d="M640 435 H1010"/>
  <circle class="node" cx="780" cy="435" r="7"/>
  <text class="net" x="735" y="410">VREF</text>
  <path class="wire" d="M780 435 V490"/>
  <rect class="part" x="762" y="490" width="36" height="100" rx="3"/>
  <text class="label" x="808" y="527">R5</text>
  <text class="text" x="808" y="551">4.7 kΩ</text>
  <text class="tiny" x="808" y="573">RR0588</text>
  <path class="wire" d="M780 590 V612"/>
  <path class="ground" d="M752 612 H808 M760 623 H800 M769 634 H791"/>
  <text class="small" x="520" y="496">Threshold tracks battery voltage</text>
  <text class="small" x="520" y="517">OBD pin 16 does not power Pico</text>

  <!-- RX output -->
  <path class="signal" d="M1215 342 H1480"/>
  <circle class="node" cx="1280" cy="342" r="7"/>
  <circle class="test" cx="1360" cy="342" r="10"/>
  <text class="net" x="1322" y="317">TP3 K_RX</text>

  <!-- RX pullup -->
  <path class="power" d="M1280 155 V202"/>
  <rect class="part" x="1262" y="202" width="36" height="92" rx="3"/>
  <text class="label" x="1308" y="237">R6</text>
  <text class="text" x="1308" y="260">4.7 kΩ</text>
  <text class="tiny" x="1308" y="281">RR0588</text>
  <path class="wire" d="M1280 294 V342"/>

  <!-- Hysteresis -->
  <path class="wire" d="M1280 342 V515 H1160"/>
  <rect class="part" x="1030" y="496" width="130" height="38" rx="3"/>
  <text class="label" x="1073" y="487">R7</text>
  <text class="text" x="1058" y="522">470 kΩ</text>
  <text class="tiny" x="1068" y="551">RR0636</text>
  <path class="wire" d="M1030 515 H970 V295 H885"/>
  <text class="small" x="1005" y="580">≈0.33 V K-line hysteresis</text>

  <!-- Comparator supply and decoupling -->
  <path class="power" d="M955 125 V165"/>
  <path class="wire" d="M955 165 V188"/>
  <path class="wire" d="M933 188 H977 M933 204 H977"/>
  <path class="wire" d="M955 204 V218"/>
  <path class="ground" d="M927 218 H983 M935 229 H975 M944 240 H966"/>
  <text class="label" x="840" y="183">C1</text>
  <text class="text" x="805" y="207">100 nF</text>
  <text class="tiny" x="805" y="228">RM7125</text>
  <text class="pin" x="980" y="157">U1 pin 8 → +5_USB</text>
  <text class="pin" x="980" y="180">U1 pin 4 → GND</text>

  <!-- Unused comparator -->
  <rect class="part" x="365" y="650" width="330" height="190" rx="12"/>
  <text class="label" x="388" y="682">U1A — terminate unused half</text>
  <path class="part" d="M475 700 L475 805 L600 752 Z"/>
  <text class="pin" x="448" y="729">3</text>
  <text class="label" x="488" y="731">+</text>
  <text class="pin" x="448" y="789">2</text>
  <text class="label" x="488" y="791">−</text>
  <text class="pin" x="575" y="741">1</text>
  <path class="wire" d="M475 725 H438 V748"/>
  <path class="ground" d="M410 748 H466 M418 759 H458 M427 770 H449"/>
  <path class="wire" d="M475 785 H405"/>
  <text class="net" x="372" y="810">VREF</text>
  <path class="wire" d="M600 752 H642"/>
  <circle class="test" cx="653" cy="752" r="10"/>
  <text class="small" x="388" y="823">pin 3 → GND; pin 2 → VREF; pin 1 NC</text>

  <!-- Q1 standard NPN symbol -->
  <circle class="part" cx="825" cy="810" r="105"/>
  <line class="wire" x1="865" y1="755" x2="865" y2="865"/>
  <line class="wire" x1="865" y1="780" x2="785" y2="700"/>
  <line class="wire" x1="865" y1="840" x2="785" y2="925" marker-end="url(#npnArrow)"/>
  <line class="wire" x1="965" y1="810" x2="865" y2="810"/>
  <path class="kline" d="M785 700 V655 H715"/>
  <text class="net" x="706" y="642">K_INT</text>
  <path class="wire" d="M785 925 V953"/>
  <path class="ground" d="M757 953 H813 M765 964 H805 M774 975 H796"/>
  <text class="label" x="794" y="807">Q1</text>
  <text class="small" x="785" y="830">BF469</text>
  <text class="tiny" x="787" y="850">ZT2200</text>
  <text class="pin" x="690" y="687">C pin 2/tab</text>
  <text class="pin" x="875" y="799">B pin 3</text>
  <text class="pin" x="700" y="937">E pin 1</text>

  <!-- TX base drive -->
  <path class="signal" d="M1480 810 H1265"/>
  <circle class="test" cx="1395" cy="810" r="10"/>
  <text class="net" x="1360" y="785">TP6 TX</text>
  <rect class="part" x="1140" y="791" width="125" height="38" rx="3"/>
  <text class="label" x="1182" y="782">R8</text>
  <text class="text" x="1168" y="817">470 Ω</text>
  <text class="tiny" x="1178" y="846">RR0564</text>
  <path class="signal" d="M1140 810 H965"/>
  <circle class="node" cx="1060" cy="810" r="7"/>
  <path class="wire" d="M1060 810 V855"/>
  <rect class="part" x="1042" y="855" width="36" height="95" rx="3"/>
  <text class="label" x="1088" y="891">R9</text>
  <text class="text" x="1088" y="914">10 kΩ</text>
  <text class="tiny" x="1088" y="935">RR0596</text>
  <path class="wire" d="M1060 950 V972"/>
  <path class="ground" d="M1032 972 H1088 M1040 983 H1080 M1049 994 H1071"/>

  <!-- BAT46 Baker clamp -->
  <path class="wire" d="M965 810 V655 H910"/>
  <path class="part" d="M910 640 L880 655 L910 670 Z"/>
  <line class="wire" x1="872" y1="637" x2="872" y2="673"/>
  <path class="wire" d="M880 655 H872 M872 655 H785"/>
  <text class="label" x="920" y="682">D2 BAT46 / ZR1141</text>
  <text class="small" x="920" y="704">Baker clamp for fast release</text>
  <text class="small" x="920" y="726">A → base; K/band → collector</text>

  <!-- Pico block -->
  <rect class="part" x="1480" y="185" width="275" height="735" rx="16"/>
  <text class="section" x="1525" y="225">P1 Raspberry Pi Pico</text>
  <text class="text" x="1502" y="319">GP5 / physical pin 7</text>
  <text class="small" x="1502" y="342">UART1 RX / local echo</text>
  <line class="signal" x1="1480" y1="342" x2="1500" y2="342"/>
  <text class="text" x="1502" y="770">GP4 / physical pin 6</text>
  <text class="small" x="1502" y="793">UART1 TX, inverted output</text>
  <line class="signal" x1="1480" y1="810" x2="1500" y2="810"/>
  <text class="text" x="1502" y="849">GND / physical pin 8</text>
  <text class="text" x="1502" y="876">3V3 OUT / pin 36</text>
  <text class="text" x="1502" y="903">VBUS / pin 40</text>

  <!-- Ground and optional pin 4 link -->
  <path class="ground" d="M260 545 H285 V1050 H1600 V920"/>
  <path class="ground" d="M260 610 H285"/>
  <rect class="optional" x="285" y="591" width="105" height="38" rx="3"/>
  <text class="small" x="299" y="616">0 Ω DNP</text>
  <path class="ground" d="M390 610 V635 H285"/>
  <circle class="node" cx="285" cy="635" r="6"/>
  <circle class="test" cx="1400" cy="1050" r="10"/>
  <text class="net" x="1357" y="1081">TP7 GND</text>
  <path class="ground" d="M1400 1050 V1093"/>
  <path class="ground" d="M1368 1093 H1432 M1378 1106 H1422 M1388 1119 H1412"/>

  <!-- Functional notes -->
  <rect class="optional" x="45" y="845" width="625" height="245" rx="12"/>
  <text class="note" x="68" y="878">BUILD NOTES</text>
  <text class="small" x="68" y="907">• Keep firmware TX inversion enabled: GP4 high pulls K low.</text>
  <text class="small" x="68" y="934">• No K-to-VBAT pull-up: the Subaru ECU already supplies the idle high.</text>
  <text class="small" x="68" y="961">• Place C1 directly beside U1 pins 8 and 4.</text>
  <text class="small" x="68" y="988">• Place D2 beside Q1; its banded end goes to Q1 collector.</text>
  <text class="small" x="68" y="1015">• Do not fit capacitance on K_INT or K_SENSE.</text>
  <text class="small" x="68" y="1042">• Expected switching: ≈0.498×VBAT rising / 0.475×VBAT falling.</text>
  <text class="small" x="68" y="1069">• Direct K-to-battery short while transmitting can destroy Q1 (accepted).</text>

  <text class="small" x="1080" y="1164">JAYCAR_FAST_KLINE • Rev A • 2026-09-05 • schematic and BOM: JAYCAR_FAST_KLINE.md</text>
</svg>
